[project]
name = "claude-harness"
version = "0.1.0"
description = "Agent-tree harness and TUI for Claude Code and Codex"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "textual>=8.2",
    "textual-tty>=0.4",
    "typesafe-sdk>=0.7",
    "watchfiles>=1.0",
]

[project.scripts]
harness = "claude_harness.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_harness"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
